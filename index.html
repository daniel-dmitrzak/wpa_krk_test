<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz egzaminacyjny</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #65676b;
    --accent: #4361ee;
    --correct: #2a9d4f;
    --wrong: #d93025;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18191a;
      --card: #242526;
      --text: #e4e6eb;
      --muted: #b0b3b8;
      --accent: #5a73f0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100dvh;
  }
  #app {
    width: 100%;
    max-width: 480px;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  h1 { font-size: 1.4rem; margin: 8px 0 4px; }
  p.hint { color: var(--muted); margin-top: 0; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 1px 4px rgb(0 0 0 / 0.08);
  }
  button {
    font: inherit;
    border: none;
    border-radius: 12px;
    padding: 16px;
    width: 100%;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
    touch-action: manipulation;
  }
  button:active { transform: scale(0.98); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .answer {
    background: var(--bg);
    color: var(--text);
    border: 2px solid transparent;
    margin-bottom: 12px;
    text-align: left;
    font-size: 1.05rem;
    line-height: 1.4;
  }
  .answer.selected { border-color: var(--accent); }
  .answer.correct {
    border-color: var(--correct);
    background: color-mix(in srgb, var(--correct) 15%, var(--card));
  }
  .answer.wrong {
    border-color: var(--wrong);
    background: color-mix(in srgb, var(--wrong) 15%, var(--card));
  }
  .answer:disabled { cursor: default; }
  .progress {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .bar {
    flex: 1;
    height: 8px;
    background: var(--card);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width 0.3s ease;
  }
  .question { font-size: 1.15rem; font-weight: 600; margin: 0 0 20px; line-height: 1.45; }
  #feedback { min-height: 1.4em; font-weight: 600; margin: 8px 0 16px; text-align: center; }
  .ok { color: var(--correct); }
  .bad { color: var(--wrong); }
  .big-score { font-size: 2.6rem; font-weight: 700; text-align: center; margin: 16px 0; }
  .hidden { display: none; }
  .spinner {
    width: 32px;
    height: 32px;
    margin: 24px auto;
    border: 4px solid var(--muted);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app">

  <!-- Loading screen -->
  <section id="loading-screen" class="card">
    <h1>📱 Quiz egzaminacyjny</h1>
    <p class="hint">Wczytywanie pytań...</p>
    <div class="spinner"></div>
  </section>

  <!-- Start screen -->
  <section id="start-screen" class="card hidden">
    <h1>📱 Quiz egzaminacyjny</h1>
    <p class="hint" id="start-hint"></p>
    <button id="start-btn" class="btn-primary">Rozpocznij quiz</button>
  </section>

  <!-- Error screen -->
  <section id="error-screen" class="card hidden">
    <h1>⚠️ Błąd</h1>
    <p class="hint" id="error-text"></p>
    <button id="retry-btn" class="btn-primary">Spróbuj ponownie</button>
  </section>

  <!-- Quiz screen -->
  <section id="quiz-screen" class="hidden">
    <div class="progress">
      <span id="counter"></span>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
    </div>
    <div class="card">
      <p class="question" id="question-text"></p>
      <div id="answers"></div>
      <p id="feedback"></p>
      <button id="next-btn" class="btn-primary" disabled>Następne</button>
    </div>
  </section>

  <!-- Score screen -->
  <section id="score-screen" class="card hidden">
    <h1 style="text-align:center">Koniec! 🎉</h1>
    <p class="big-score" id="score-text"></p>
    <p class="hint" style="text-align:center" id="score-msg"></p>
    <button id="restart-btn" class="btn-primary">Zagraj ponownie</button>
  </section>

</div>

<script>
"use strict";

const CSV_URL = "exam_questions.csv";
const SESSION_SIZE = 20; // questions per session

let questions = [];
let current = 0;
let score = 0;
let locked = false;

const el = (id) => document.getElementById(id);

function showScreen(id) {
  ["loading-screen", "start-screen", "error-screen",
   "quiz-screen", "score-screen"].forEach((s) =>
    el(s).classList.toggle("hidden", s !== id)
  );
}

// ---------- CSV parsing (handles quoted fields with commas) ----------
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else field += c;
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ",") {
      row.push(field.trim()); field = "";
    } else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field.trim()); field = "";
      if (row.some((f) => f !== "")) rows.push(row);
      row = [];
    } else {
      field += c;
    }
  }
  row.push(field.trim());
  if (row.some((f) => f !== "")) rows.push(row);
  return rows;
}

// Expects header: Question_Number,Question_Text,Answer_A,Answer_B,Answer_C,Correct_Answer
function loadCSVText(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) throw new Error("CSV needs a header row and at least one question.");

  const header = rows[0].map((h) => h.toLowerCase());
  const idx = (name) => header.indexOf(name.toLowerCase());
  const qIdx = idx("Question_Text");
  const cIdx = idx("Correct_Answer");
  if (qIdx === -1 || cIdx === -1) {
    throw new Error('CSV must have "Question_Text" and "Correct_Answer" columns.');
  }
  const answerCols = ["Answer_A", "Answer_B", "Answer_C"].map(idx);

  questions = rows.slice(1).map((r, i) => {
    const answers = answerCols
      .map((ci, j) => ({ text: r[ci], letter: "ABC"[j] }))
      .filter((a) => a.text);
    const correctLetter = (r[cIdx] || "").trim().toUpperCase();
    const correct = answers.findIndex((a) => a.letter === correctLetter);
    if (correct === -1) {
      throw new Error(`Row ${i + 2}: unknown correct answer "${correctLetter}"`);
    }
    const number = parseInt(r[idx("Question_Number")], 10) || i + 1;
    return { number, question: r[qIdx], answers: answers.map((a) => a.text), correct };
  });

  if (questions.length === 0) throw new Error("No questions found in CSV.");
}

// ---------- Load CSV from server ----------
async function loadQuiz() {
  showScreen("loading-screen");
  try {
    const res = await fetch(CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(`Server returned ${res.status} for ${CSV_URL}`);
    loadCSVText(await res.text());
    const shown = Math.min(questions.length, SESSION_SIZE);
    el("start-hint").textContent =
      `Plik zawiera ${questions.length} pytań. W każdej sesji losowane jest ${shown}. Powodzenia!`;
    showScreen("start-screen");
  } catch (err) {
    el("error-text").textContent = err.message;
    showScreen("error-screen");
  }
}

// ---------- Quiz flow (shuffled questions, fixed answer order) ----------
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  // Shuffle questions, keep first SESSION_SIZE, answers stay in CSV order
  questions = shuffle(questions);
  if (questions.length > SESSION_SIZE) questions = questions.slice(0, SESSION_SIZE);

  current = 0;
  score = 0;
  showScreen("quiz-screen");
  showQuestion();
}

function showQuestion() {
  locked = false;
  const q = questions[current];
  el("counter").textContent = `${current + 1} / ${questions.length}`;
  el("bar-fill").style.width = `${(current / questions.length) * 100}%`;
  el("question-text").textContent = q.question;
  el("feedback").textContent = "";
  el("feedback").className = "";
  el("next-btn").disabled = true;
  el("next-btn").textContent =
    current === questions.length - 1 ? "Zobacz wynik" : "Następne";

  const box = el("answers");
  box.innerHTML = "";
  q.answers.forEach((text, i) => {
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.textContent = `${"ABC"[i]}. ${text}`;
    btn.addEventListener("click", () => selectAnswer(i, btn));
    box.appendChild(btn);
  });
}

function selectAnswer(i, btn) {
  if (locked) return;
  locked = true;
  const q = questions[current];
  const buttons = [...document.querySelectorAll(".answer")];
  buttons.forEach((b) => (b.disabled = true));
  buttons[q.correct].classList.add("correct");

  if (i === q.correct) {
    score++;
    el("feedback").textContent = "✅ Poprawna odpowiedź!";
    el("feedback").className = "ok";
  } else {
    btn.classList.add("wrong");
    el("feedback").textContent = "❌ Niestety...";
    el("feedback").className = "bad";
  }
  el("next-btn").disabled = false;
}

el("next-btn").addEventListener("click", () => {
  current++;
  if (current < questions.length) showQuestion();
  else showResults();
});

function showResults() {
  showScreen("score-screen");
  el("score-text").textContent = `${score} / ${questions.length}`;
  const pct = score / questions.length;
  el("score-msg").textContent =
    pct === 1 ? "Wynik idealny!" :
    pct >= 0.7 ? "Świetnie!" :
    pct >= 0.4 ? "Nieźle — spróbuj jeszcze raz!" :
    "Powodzenia na kolejnej próbie!";
}

el("start-btn").addEventListener("click", startQuiz);
el("retry-btn").addEventListener("click", loadQuiz);
el("restart-btn").addEventListener("click", () => showScreen("start-screen"));

loadQuiz();
</script>
</body>
</html>
